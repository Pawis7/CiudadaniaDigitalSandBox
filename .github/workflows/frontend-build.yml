name: Frontend build

on:
  push:
    paths:
      - 'CDJ-Front/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'CDJ-Front/**'
      - '.github/workflows/frontend-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: CDJ-Front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CDJ-Front/package-lock.json
      - run: npm ci
      - run: npm run build
