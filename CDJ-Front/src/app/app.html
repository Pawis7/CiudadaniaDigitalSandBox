<div class="flex min-h-screen bg-[#F8FAFC] font-['Inter'] p-6 gap-6">
  <!-- Floating Sidebar Container -->
  <div class="hidden lg:block w-72 flex-shrink-0">
    <app-sidebar></app-sidebar>
  </div>
  
  <div class="flex-1 flex flex-col gap-6">
    <!-- Navbar Card -->
    <header class="bg-white rounded-[2rem] border border-slate-100 px-8 py-4 shadow-sm">
      <div class="flex items-center justify-end gap-12">
        <nav class="flex gap-8">
          <a href="#" class="text-blue-600 font-bold border-b-2 border-blue-600 pb-1">Inicio</a>
          <a href="#" class="text-slate-500 font-medium hover:text-slate-800 transition-colors">Recursos</a>
          <a href="#" class="text-slate-500 font-medium hover:text-slate-800 transition-colors">Quiénes somos</a>
        </nav>
        <button class="bg-teal-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-teal-700 transition-colors">
          Explorar
        </button>
      </div>
    </header>

    <main class="flex-1">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer Card -->
    <footer class="bg-white rounded-[3rem] border border-slate-100 p-12 shadow-sm">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-12">
        <div class="col-span-2">
          <div class="flex items-center gap-2 mb-6">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-400 via-violet-400 to-pink-400 rounded-xl"></div>
            <div class="font-bold text-slate-800 text-lg leading-tight">Ciudadanía Digital</div>
          </div>
          <p class="text-slate-500 max-w-xs leading-relaxed">
            Promovemos el uso ético y responsable de la tecnología para una ciudadanía digital activa y consciente.
          </p>
          <div class="flex gap-4 mt-8">
            <a href="#" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:bg-blue-600 hover:text-white transition-all shadow-sm"><span class="material-icons-outlined">facebook</span></a>
            <a href="#" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition-all shadow-sm"><span class="material-icons-outlined">close</span></a>
            <a href="#" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:bg-pink-600 hover:text-white transition-all shadow-sm"><span class="material-icons-outlined">photo_camera</span></a>
            <a href="#" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:bg-red-600 hover:text-white transition-all shadow-sm"><span class="material-icons-outlined">play_arrow</span></a>
          </div>
        </div>
        <div *ngFor="let group of [
          { title: 'Recursos', items: ['Videos animados', 'Audiocuentos', 'Microlecciones', 'Guías y checklist'] },
          { title: 'Para aprender', items: ['Secuencias didácticas', 'Proyectos', 'Retos', 'Tutoriales imprimibles'] },
          { title: 'Institucional', items: ['Quiénes somos', 'Alianzas', 'Noticias', 'Contacto'] }
        ]">
          <h4 class="font-bold text-slate-800 mb-6 uppercase text-xs tracking-widest">{{group.title}}</h4>
          <ul class="space-y-3">
            <li *ngFor="let item of group.items">
              <a href="#" class="text-slate-500 hover:text-blue-600 transition-colors text-sm">{{item}}</a>
            </li>
          </ul>
        </div>
      </div>
      <div class="pt-12 mt-12 border-t border-slate-50 text-center text-xs text-slate-400">
        © 2024 Ciudadanía Digital. Todos los derechos reservados.
      </div>
    </footer>
  </div>
</div>
