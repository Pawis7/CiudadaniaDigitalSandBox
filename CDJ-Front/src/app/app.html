<div class="relative flex min-h-[100dvh] gap-4 p-3 sm:p-4 lg:gap-5 lg:p-5"><div class="relative isolate hidden shrink-0 lg:block no-print" style="z-index:60"><div class="sticky top-5 h-[calc(100dvh-2.5rem)]"><app-sidebar variant="desktop"></app-sidebar></div></div><div class="fixed inset-0 z-[80] lg:hidden no-print" [class.pointer-events-none]="!drawerOpen()" aria-modal="true" role="dialog"><div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity duration-300" [class.opacity-0]="!drawerOpen()" [class.opacity-100]="drawerOpen()" (click)="closeDrawer()"></div><div class="absolute inset-y-0 left-0 flex w-[86%] max-w-[320px] flex-col p-3 transition-transform duration-300" [class.-translate-x-full]="!drawerOpen()" [class.translate-x-0]="drawerOpen()"><app-sidebar variant="mobile" (navigate)="closeDrawer()"></app-sidebar></div></div><div class="flex min-w-0 flex-1 flex-col gap-5 lg:gap-6"><header class="topbar no-print flex items-center gap-3 rounded-2xl border border-[color:var(--border-soft)] bg-[color:var(--surface-card)] px-3 py-2.5 shadow-sm sm:px-4 lg:px-5 lg:py-3" [class.shadow-md]="scrolled()" [class.is-hidden]="headerHidden()"><div class="flex items-center gap-2.5 lg:hidden"><button type="button" (click)="toggleDrawer()" class="grid h-9 w-9 place-items-center rounded-lg border border-[color:var(--border)] text-[color:var(--text-primary)]"><span class="h-[18px] w-[18px]"><app-ui-icon [name]="drawerOpen()?'close':'menu'"></app-ui-icon></span></button><a routerLink="/"><img src="/logo.png" alt="Ciudadanía Digital" class="h-9 w-auto"></a></div><nav class="hidden items-center gap-4 lg:flex"><a *ngFor="let link of topNav" [routerLink]="link.href" [routerLinkActiveOptions]="{exact:link.exact}" routerLinkActive="!border-[color:var(--c-cdj)] !text-[color:var(--text-primary)]" class="border-b-2 border-transparent px-1 py-2 text-[13.5px] font-semibold text-[color:var(--text-secondary)]">{{link.label}}</a></nav><div class="ml-auto"><button type="button" (click)="toggleTheme()" [attr.aria-label]="theme()==='dark'?'Cambiar a tema claro':'Cambiar a tema oscuro'" class="grid h-9 w-9 place-items-center rounded-lg border border-[color:var(--border)] text-[color:var(--text-secondary)]"><span class="h-[17px] w-[17px]"><app-ui-icon [name]="theme()==='dark'?'sun':'moon'"></app-ui-icon></span></button></div></header><main class="flex-1"><router-outlet></router-outlet></main><footer class="rounded-2xl border border-[color:var(--border-soft)] bg-[color:var(--surface-card)] p-6 sm:p-10 lg:p-12 no-print"><div class="grid grid-cols-1 gap-10 md:grid-cols-3 lg:grid-cols-5 lg:gap-12"><div class="md:col-span-full lg:col-span-2"><a routerLink="/"><img src="/logo.png" alt="Ciudadanía Digital" class="mb-5 h-14 w-auto"></a><div class="mb-5 flex flex-wrap items-center gap-5"><img src="/footer/educacion.png" alt="Secretaría de Educación" class="footer-logo h-14 w-auto"><img src="/footer/gobierno_del_estado.png" alt="Gobierno de Jalisco" class="footer-logo h-16 w-auto"></div><p class="max-w-sm text-[color:var(--text-soft)]">{{branding().tagline}}</p></div><div *ngFor="let group of footerColumns()"><h4 class="mb-5 text-xs font-black uppercase tracking-widest">{{group.title}}</h4><ul class="space-y-3"><li *ngFor="let item of group.links"><a *ngIf="item.href.startsWith('/')" [routerLink]="item.href" class="text-sm text-[color:var(--text-soft)]">{{item.label}}</a><a *ngIf="!item.href.startsWith('/')" [href]="item.href" target="_blank" class="text-sm text-[color:var(--text-soft)]">{{item.label}}</a></li></ul></div></div><div class="mt-10 border-t border-[color:var(--border-soft)] pt-8 text-xs text-[color:var(--text-mute)]">© {{year}} {{branding().siteName}} · Gobierno de Jalisco</div></footer></div></div>
