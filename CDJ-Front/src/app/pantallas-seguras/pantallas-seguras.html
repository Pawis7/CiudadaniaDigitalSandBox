<!-- HERO BANNER (CSS Styled Gradient instead of image) -->
<section
  appReveal="fade"
  [revealDuration]="700"
  class="main-hero relative mb-12 overflow-hidden rounded-[2.5rem] border border-[color:var(--border-soft)] shadow-[var(--shadow-lg)]"
  data-audience="help">
  <div class="w-full h-full bg-gradient-to-br from-[#4c1d95] via-[#312e81] to-[#1e1b4b] flex flex-col items-center justify-center p-6 text-center select-none">
    <div class="flex items-center gap-2 mb-2 md:mb-4 text-violet-200">
      <span translate="no" class="material-symbols-rounded text-2xl md:text-4xl text-[color:var(--c-help-soft)]">screenshot_monitor</span>
      <span class="text-[10px] md:text-xs font-black tracking-widest uppercase opacity-85">Jalisco · Entornos Digitales</span>
    </div>
    <h1 class="text-white text-base sm:text-2xl md:text-4xl lg:text-5xl font-black uppercase tracking-wider drop-shadow-md">
      BANNER DE PANTALLAS SEGURAS
    </h1>
    <p class="text-violet-200/70 text-[9px] sm:text-xs md:text-sm font-medium mt-1 md:mt-2 max-w-xl text-balance">
      Ley para Garantizar los Derechos de Niñas, Niños y Adolescentes en Entornos Digitales
    </p>
  </div>
</section>

<!-- TEXTO INFORMATIVO -->
<section appReveal="up" class="mb-14">
  <div class="max-w-4xl">
    <nav class="breadcrumb mb-6">
      <a routerLink="/">Inicio</a>
      <span class="breadcrumb-sep">›</span>
      <span class="is-current">Pantallas Seguras</span>
    </nav>
    <p class="eyebrow text-[color:var(--c-help)]">Nueva Ley Estatal</p>
    <h1 class="display-1 mt-2 text-balance">
      {{ editorial.title }}
    </h1>
    <p class="lede mt-6 max-w-3xl">
      {{ editorial.explanatory }}
    </p>
  </div>
</section>
