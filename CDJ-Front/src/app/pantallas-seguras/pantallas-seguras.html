<!-- HERO BANNER (Simple & Clean) -->
<section
  appReveal="fade"
  [revealDuration]="700"
  class="main-hero relative mb-12 overflow-hidden rounded-[2.5rem] border border-[color:var(--border-soft)] shadow-[var(--shadow-lg)]"
  data-audience="screens">
  <img
    appImageLoader
    src="/banners/CD_PantallasSeguras.png"
    alt="Ley de Pantallas Seguras Banner"
    class="block w-full h-full object-cover">
</section>

<!-- TEXTO INFORMATIVO -->
<section appReveal="up" class="mb-14">
  <div class="max-w-4xl">
    <p class="eyebrow text-[color:var(--c-screens)]">Nueva Ley Estatal</p>
    <h1 class="display-1 mt-2 text-balance">
      {{ editorial.title }}
    </h1>
    <p class="lede mt-6 max-w-3xl">
      {{ editorial.explanatory }}
    </p>
  </div>
</section>
