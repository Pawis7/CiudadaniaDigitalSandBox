<section appReveal="up" class="mb-8 max-w-4xl" data-audience="series">
  <h1 class="display-1">Series</h1>
  <p class="lede mt-3 max-w-3xl">Colecciones de contenidos para aprender, reflexionar y compartir.</p>
</section>

<section class="mb-12" data-audience="series">
  <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
    <div class="flex flex-wrap items-end gap-6 w-full md:w-auto">
      <div>
        <p class="eyebrow text-[color:var(--text-mute)]">Colección completa</p>
        <h2 class="display-2 mt-1">Todas las colecciones</h2>
      </div>
      
      <!-- Buscador integrado -->
      <div class="search-input w-full max-w-xs bg-white border border-[color:var(--border-soft)] shadow-sm">
        <span translate="no" class="material-symbols-rounded text-[18px] text-[color:var(--text-mute)]">search</span>
        <input type="text" [ngModel]="query()" (ngModelChange)="query.set($event)" placeholder="Buscar colecciones, temas...">
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3">
    @for (card of cards(); track card.id; let i = $index) {
      <app-feature-card [card]="card" [delay]="i * 80" [showIcon]="false" />
    }
    @if (!cards().length) {
      <div class="surface col-span-full p-12 text-center">
        <span translate="no" class="material-symbols-rounded text-5xl text-[color:var(--text-mute)]">movie</span>
        <h3 class="mt-3 text-lg font-black tracking-tight text-[color:var(--text-primary)]">No encontramos series con esa búsqueda</h3>
        <p class="mt-1 text-sm text-[color:var(--text-soft)]">Prueba con otro tema, palabra o episodio.</p>
      </div>
    }
  </div>
</section>
