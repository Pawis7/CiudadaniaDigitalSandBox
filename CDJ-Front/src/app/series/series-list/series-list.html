<section
  appReveal="fade"
  class="relative mb-8 overflow-hidden rounded-[1.75rem] border border-slate-100 bg-white p-6 shadow-sm sm:mb-12 sm:rounded-[2.5rem] sm:p-12">
  <div aria-hidden="true" class="pointer-events-none absolute -right-16 -top-20 h-72 w-72 rounded-full bg-gradient-to-tr from-pink-300/30 via-violet-300/30 to-blue-300/30 blur-3xl anim-blob"></div>

  <nav class="mb-3 flex items-center gap-2 text-xs font-semibold text-slate-400">
    <a routerLink="/" class="transition-colors hover:text-slate-700">Inicio</a>
    <span translate="no" class="notranslate material-symbols-rounded text-sm">chevron_right</span>
    <span class="text-slate-700">Series</span>
  </nav>

  <p appReveal="up" class="text-xs font-black uppercase tracking-widest text-pink-600">Catálogo</p>
  <h1 appReveal="up" [revealDelay]="80"
      class="text-balance font-black leading-tight tracking-tight text-slate-800"
      style="font-size: clamp(1.75rem, 2vw + 1rem, 2.75rem)">
    Series para mirar y aprender
  </h1>
  <p appReveal="up" [revealDelay]="160" class="mt-3 max-w-2xl text-sm text-slate-500 sm:text-base">
    Episodios cortos en YouTube, organizados por colección. Selecciona una serie para empezar.
  </p>
</section>

<section class="mb-12 grid grid-cols-1 gap-4 sm:gap-6 md:grid-cols-2 xl:grid-cols-3">
  <a *ngFor="let serie of series(); let i = index"
     [routerLink]="['/series', serie.slug]"
     appReveal="up"
     [revealDelay]="i * 90"
     class="group relative overflow-hidden rounded-[1.5rem] border border-slate-100 bg-white shadow-sm transition-all hover:-translate-y-1 hover:shadow-2xl sm:rounded-[2rem]">
    <div class="relative aspect-[16/10] w-full overflow-hidden">
      <div class="absolute inset-0 transition-transform duration-[1.2s] group-hover:scale-110">
        <app-editable-image
          [id]="'series-cover-' + serie.id"
          [src]="serie.coverImageUrl"
          [alt]="serie.title"
          [width]="1600" [height]="1000" aspectLabel="16:10"
          imgClass="h-full w-full object-cover">
        </app-editable-image>
      </div>
      <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent"></div>

      <span class="absolute left-4 top-4 inline-flex items-center gap-2 rounded-full bg-white/90 px-3 py-1 text-[11px] font-bold text-slate-700 shadow backdrop-blur">
        <span class="grid h-5 w-5 place-items-center rounded-full text-white" [ngClass]="serie.iconBgClass">
          <span translate="no" class="notranslate material-symbols-rounded text-[14px] icon-fill">{{ serie.icon }}</span>
        </span>
        {{ serie.episodeCount }} episodios
      </span>

      <span class="absolute bottom-4 right-4 grid h-12 w-12 place-items-center rounded-full bg-white text-slate-800 shadow-2xl transition-all duration-500 group-hover:scale-110">
        <span translate="no" class="notranslate material-symbols-rounded text-2xl icon-fill">play_arrow</span>
      </span>

      <div class="absolute inset-x-4 bottom-4 max-w-[70%] sm:inset-x-6 sm:bottom-6">
        <h3 class="text-xl font-black tracking-tight text-white drop-shadow-md sm:text-2xl">{{ serie.title }}</h3>
      </div>
    </div>

    <div class="p-5 sm:p-6">
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">{{ serie.tagline }}</p>
      <p class="mt-2 line-clamp-3 text-sm leading-relaxed text-slate-500">{{ serie.description }}</p>
    </div>

  </a>
</section>
