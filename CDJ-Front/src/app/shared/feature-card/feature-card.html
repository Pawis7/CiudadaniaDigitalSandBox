<div
  appReveal="up"
  [disableReveal]="disableReveal"
  [revealDelay]="delay"
  [attr.data-audience]="card.audience"
  class="card card-hover group relative flex flex-col overflow-hidden">

  <!-- ── ENLACE PRINCIPAL ──────────────────────────────────────────────── -->
  <a [routerLink]="card.href" class="flex flex-1 flex-col overflow-hidden">

    <!-- ── Imagen (5:3 nativo de portadas, completa sin recorte) ── -->
    <div class="relative aspect-[5/3] w-full overflow-hidden bg-[color:var(--surface-soft)]">
      <div class="absolute inset-0 transition-transform duration-[900ms] ease-[cubic-bezier(0.32,0.72,0,1)]">
        <app-editable-image
          [id]="card.id"
          [src]="card.imageUrl"
          [alt]="card.title"
          [width]="1875" [height]="1125" aspectLabel="5:3"
          imgClass="h-full w-full object-contain"
          [theme]="card.audience"
          [scene]="card.illoScene || 'spark'">
        </app-editable-image>
      </div>

      <!-- Halo audience sutil solo en hover -->
      <div class="pointer-events-none absolute inset-0 opacity-0 transition-opacity duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] group-hover:opacity-100"
           style="background: radial-gradient(120% 80% at 50% 100%, color-mix(in srgb, var(--aud, var(--c-cdj)) 22%, transparent) 0%, transparent 65%);"></div>

    </div>

    <!-- ── Texto + icono · compacto ──────────────────────────────────── -->
    <div class="flex flex-1 flex-col gap-2.5 p-4 sm:p-5">
      <div class="flex items-start gap-3">
        <!-- Icono: controlable con [showIcon] -->
        @if (showIcon) {
          <span class="relative grid h-10 w-10 shrink-0 place-items-center rounded-[12px] text-white ring-1 ring-black/5 shadow-[0_6px_16px_-6px_color-mix(in_srgb,var(--aud,var(--c-cdj))_55%,transparent),inset_0_1px_0_rgba(255,255,255,0.3),inset_0_-1px_0_rgba(0,0,0,0.1)] transition-all duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] group-hover:shadow-[0_12px_24px_-8px_color-mix(in_srgb,var(--aud,var(--c-cdj))_70%,transparent),inset_0_1px_0_rgba(255,255,255,0.4)]"
                [ngClass]="card.iconBgClass">
            @if (card.id === 'teens' || card.audience === 'teens') {
              <svg class="h-5 w-5 fill-none stroke-current drop-shadow-[0_1px_1px_rgba(0,0,0,0.2)]" viewBox="0 0 24 24" aria-hidden="true" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8.3 8.2c.35-2.15 1.75-3.55 3.7-3.55 2.05 0 3.45 1.35 3.75 3.55"/>
                <circle cx="12" cy="9.3" r="3.25"/>
                <path d="M5.8 19.25c.65-3.85 2.8-6 6.2-6s5.55 2.15 6.2 6"/>
                <path d="M9.4 6.75c1.1.85 3.65 1.1 5.2-.1"/>
              </svg>
            } @else if (card.id === 'teachers' || card.audience === 'teachers') {
              <svg class="h-5 w-5 fill-none stroke-current drop-shadow-[0_1px_1px_rgba(0,0,0,0.2)]" viewBox="0 0 24 24" aria-hidden="true" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 10.2 12 6l8 4.2"/>
                <path d="M12 6V2.7"/>
                <path d="M12 2.8c1.7-1 3.1 1 4.8 0v2.5c-1.7 1-3.1-1-4.8 0"/>
                <path d="M5.5 9.5v9.2h13V9.5"/>
                <path d="M10.1 18.7v-4.6h3.8v4.6"/>
                <path d="M7.6 12h1.7M14.7 12h1.7M3.5 18.7h17"/>
              </svg>
            } @else {
              <span translate="no" class="material-symbols-rounded text-[20px] leading-none icon-fill drop-shadow-[0_1px_1px_rgba(0,0,0,0.2)]">{{ card.icon }}</span>
            }
          </span>
        }

        <div class="min-w-0 flex-1">
          @if (card.badge) {
            <p class="text-[9.5px] font-black uppercase tracking-[0.14em] text-[color:var(--aud,var(--c-cdj))]">
              {{ card.badge }}
            </p>
          }
          <h3 class="mt-0.5 line-clamp-1 text-[16px] font-black leading-tight tracking-tight text-[color:var(--text-primary)] sm:text-[17px]">
            {{ card.title }}
          </h3>
        </div>
      </div>

      @if (showDescription) {
        <p class="line-clamp-2 min-h-[2.7em] text-[13px] leading-relaxed text-[color:var(--text-soft)]">
          {{ card.description }}
        </p>
      }
    </div>

  </a>


</div>
