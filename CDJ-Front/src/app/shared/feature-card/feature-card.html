<div
  appReveal="up"
  [disableReveal]="disableReveal"
  [revealDelay]="delay"
  [attr.data-audience]="card.audience"
  class="card card-hover group relative flex flex-col overflow-hidden">

  <!-- ── ENLACE PRINCIPAL ──────────────────────────────────────────────── -->
  <a [routerLink]="card.href" class="flex flex-1 flex-col overflow-hidden">

    <!-- ── Imagen (5:3 nativo de portadas, completa sin recorte) ── -->
    <div class="relative aspect-[5/3] w-full overflow-hidden bg-[color:var(--surface-soft)]">
      <div class="absolute inset-0 transition-transform duration-[900ms] ease-[cubic-bezier(0.32,0.72,0,1)] group-hover:scale-[1.04]">
        <app-editable-image
          [id]="card.id"
          [src]="card.imageUrl"
          [alt]="card.title"
          [width]="1875" [height]="1125" aspectLabel="5:3"
          imgClass="h-full w-full object-contain"
          [theme]="card.audience"
          [scene]="card.illoScene || 'spark'">
        </app-editable-image>
      </div>

      <!-- Halo audience sutil solo en hover -->
      <div class="pointer-events-none absolute inset-0 opacity-0 transition-opacity duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] group-hover:opacity-100"
           style="background: radial-gradient(120% 80% at 50% 100%, color-mix(in srgb, var(--aud, var(--c-cdj)) 22%, transparent) 0%, transparent 65%);"></div>


      <!-- Play button: button-in-button con magnetic hover -->
      <div class="pointer-events-none absolute bottom-3.5 right-3.5">
        <span class="relative grid h-11 w-11 place-items-center rounded-full bg-white/95 text-slate-900 ring-1 ring-black/5 shadow-[0_6px_18px_-6px_rgba(0,0,0,0.45)] transition-all duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] group-hover:h-12 group-hover:w-12 group-hover:bg-[color:var(--aud,var(--c-cdj))] group-hover:text-white group-hover:-translate-y-0.5 group-hover:shadow-[0_10px_24px_-8px_color-mix(in_srgb,var(--aud,var(--c-cdj))_55%,transparent)]">
          <span translate="no" class="material-symbols-rounded text-[22px] icon-fill transition-transform duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] group-hover:translate-x-[1px]">play_arrow</span>
        </span>
      </div>
    </div>

    <!-- ── Texto + icono · compacto ──────────────────────────────────── -->
    <div class="flex flex-1 flex-col gap-2.5 p-4 sm:p-5">
      <div class="flex items-start gap-3">
        <!-- Icono "perrón": gradient + inner highlight + glow del color audience -->
        <span class="relative grid h-10 w-10 shrink-0 place-items-center rounded-[12px] text-white ring-1 ring-black/5 shadow-[0_6px_16px_-6px_color-mix(in_srgb,var(--aud,var(--c-cdj))_55%,transparent),inset_0_1px_0_rgba(255,255,255,0.3),inset_0_-1px_0_rgba(0,0,0,0.1)] transition-all duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] group-hover:-translate-y-0.5 group-hover:rotate-[-4deg] group-hover:shadow-[0_12px_24px_-8px_color-mix(in_srgb,var(--aud,var(--c-cdj))_70%,transparent),inset_0_1px_0_rgba(255,255,255,0.4)]"
              [ngClass]="card.iconBgClass">
          <span translate="no" class="material-symbols-rounded text-[20px] leading-none icon-fill drop-shadow-[0_1px_1px_rgba(0,0,0,0.2)]">{{ card.icon }}</span>
        </span>

        <div class="min-w-0 flex-1">
          @if (card.badge) {
            <p class="text-[9.5px] font-black uppercase tracking-[0.14em] text-[color:var(--aud,var(--c-cdj))]">
              {{ card.badge }}
            </p>
          }
          <h3 class="mt-0.5 line-clamp-1 text-[16px] font-black leading-tight tracking-tight text-[color:var(--text-primary)] sm:text-[17px]">
            {{ card.title }}
          </h3>
        </div>
      </div>

      @if (showDescription) {
        <p class="line-clamp-2 min-h-[2.7em] text-[13px] leading-relaxed text-[color:var(--text-soft)]">
          {{ card.description }}
        </p>
      }
    </div>

  </a>


</div>
