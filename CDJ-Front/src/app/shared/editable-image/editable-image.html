<div class="editable-img relative h-full w-full">
  <img
    [src]="resolvedSrc()"
    [alt]="alt$"
    [class]="imgClass$"
    [attr.loading]="loadingAttr"
    decoding="async">

  <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)">

  @if (editMode()) {
    <div class="pointer-events-none absolute inset-0 z-10 ring-2 ring-blue-500/70 ring-offset-0 rounded-[inherit]">
      <span class="pointer-events-none absolute left-2 top-2 rounded-full bg-blue-600/95 px-2.5 py-1 text-[10px] font-bold uppercase tracking-widest text-white shadow-lg backdrop-blur">
        ID · {{ displayId }}
      </span>

      @if (widthLabel || aspect) {
        <span class="pointer-events-none absolute right-2 top-2 inline-flex items-center gap-1 rounded-full bg-white/95 px-2.5 py-1 text-[10px] font-bold text-slate-700 shadow backdrop-blur">
          <span translate="no" class="notranslate material-symbols-rounded text-[14px]">aspect_ratio</span>
          @if (widthLabel) { {{ widthLabel }} }
          @if (widthLabel && aspect) { · }
          @if (aspect) { {{ aspect }} }
        </span>
      }

      <div class="pointer-events-auto absolute inset-x-2 bottom-2 flex flex-wrap items-center justify-between gap-2">
        <button
          type="button"
          (click)="pickFile()"
          [disabled]="uploading()"
          class="group inline-flex items-center gap-1.5 rounded-full bg-slate-900/95 px-3 py-1.5 text-[11px] font-bold text-white shadow-lg backdrop-blur transition-all hover:bg-blue-600 active:scale-95 disabled:opacity-50">
          <span translate="no" class="notranslate material-symbols-rounded text-[16px]">{{ uploading() ? 'progress_activity' : 'edit' }}</span>
          {{ uploading() ? 'Subiendo…' : (hasOverride() ? 'Reemplazar' : 'Modificar') }}
        </button>

        @if (hasOverride()) {
          <button
            type="button"
            (click)="reset()"
            class="inline-flex items-center gap-1.5 rounded-full bg-white/95 px-3 py-1.5 text-[11px] font-bold text-slate-700 shadow-lg backdrop-blur transition-all hover:bg-slate-50 active:scale-95">
            <span translate="no" class="notranslate material-symbols-rounded text-[16px]">restart_alt</span>
            Restablecer
          </button>
        }
      </div>

      @if (errorMsg()) {
        <div class="pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-lg bg-red-600/95 px-3 py-2 text-xs font-bold text-white shadow-lg">
          {{ errorMsg() }}
        </div>
      }
    </div>
  }
</div>
