<div class="editable-img relative h-full w-full">
  @if (showFallback()) {
    <app-aud-illustration
      [theme]="themeVal"
      [scene]="sceneVal"
      [alt]="alt$"
      [class]="imgClass$">
    </app-aud-illustration>
  }
  @if (!imgLoaded() && !showFallback()) {
    <div class="absolute inset-0 bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
  }
  <img
    [src]="resolvedSrc()"
    [alt]="alt$"
    [class]="imgClass$"
    [attr.loading]="loadingAttr"
    class="transition-opacity duration-300"
    [class.opacity-0]="!imgLoaded() || showFallback()"
    [class.absolute]="showFallback()"
    [class.inset-0]="showFallback()"
    decoding="async"
    (load)="onImgLoad()"
    (error)="onImgError()">
</div>
