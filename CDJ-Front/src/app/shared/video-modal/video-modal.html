<!-- ═══════════════════════════════════════════════════════════
     VIDEO MODAL — componente global premium
     Backdrop oscuro semi-trans + panel con tema claro/oscuro
     X solo en la esquina INFERIOR del panel (no choca con ⚙ de YT)
════════════════════════════════════════════════════════════ -->

<!-- Backdrop: clic fuera cierra -->
<div class="vm-backdrop" [class.vm-closing]="closing()" (click)="onBackdropClick()" role="dialog" aria-modal="true">

  <!-- Wrapper externo: permite que la X sobresalga del panel -->
  <div class="vm-panel-wrap" (click)="onPanelClick($event)">

    <!-- Botón X flotante en esquina: mitad adentro, mitad afuera -->
    <button type="button" class="vm-corner-close" (click)="onBackdropClick()" aria-label="Cerrar">
      <span translate="no" class="material-symbols-rounded">close</span>
    </button>

    <!-- Panel con overflow:hidden para el iframe -->
    <div class="vm-panel" #panel
         (touchstart)="onTouchStart($event)"
         (touchmove)="onTouchMove($event)"
         (touchend)="onTouchEnd($event)">

      <!-- Drag handle visual para móvil -->
      <div class="vm-drag-handle"></div>

    <!-- ── Player ────────────────────────────────────────── -->
    <div class="vm-player-wrap">
      @if (embedUrl(); as src) {
        <iframe
          [src]="src"
          [title]="data()?.title"
          class="vm-iframe"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      }
    </div>

    <!-- ── Metadata ───────────────────────────────────────── -->
    @if (data(); as v) {
      <div class="vm-meta" #meta>

        <!-- Fila principal: título + duración -->
        <div class="vm-meta-header">
          <div class="vm-title-block">
            <!-- Serie de origen (etiqueta pequeña encima del título) -->
            @if (v.seriesTitle) {
              <p class="vm-eyebrow">
                <span translate="no" class="material-symbols-rounded vm-eyebrow-icon">play_circle</span>
                {{ v.seriesTitle }}
              </p>
            }
            <h2 class="vm-title">{{ v.title }}</h2>
          </div>

          <!-- Solo duración, ya no hay X aquí -->
          @if (v.durationLabel) {
            <span class="vm-pill vm-pill--right">{{ v.durationLabel }}</span>
          }
        </div>

        <!-- Descripción -->
        @if (v.description) {
          <p class="vm-description">{{ v.description }}</p>
        }

        <!-- Tags -->
        @if (v.tags?.length) {
          <div class="vm-tags">
            <span *ngFor="let t of v.tags" class="meta-pill">#{{ t }}</span>
          </div>
        }

      </div>
    }

    </div><!-- /vm-panel -->
  </div><!-- /vm-panel-wrap -->
</div><!-- /vm-backdrop -->
