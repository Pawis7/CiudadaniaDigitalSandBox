<!-- ═══════════════════════════════════════════════════════════
     VIDEO MODAL — componente global premium
     Backdrop oscuro semi-trans + panel con tema claro/oscuro
     Cierre visible y accesible en escritorio y móvil
════════════════════════════════════════════════════════════ -->

<!-- Backdrop: clic fuera cierra -->
<div class="vm-backdrop"
     [class.vm-closing]="closing()"
     (click)="onBackdropClick()"
     role="dialog"
     aria-modal="true"
     aria-labelledby="vm-title"
     [attr.aria-describedby]="data()?.description ? 'vm-description' : null">

  <!-- Wrapper externo: permite que la X sobresalga del panel -->
  <div class="vm-panel-wrap" #panelWrap (click)="onPanelClick($event)">

    <!-- Botón X flotante en esquina: mitad adentro, mitad afuera -->
    <button #closeButton type="button" class="vm-corner-close" (click)="onBackdropClick()" aria-label="Cerrar video">
      <span translate="no" class="material-symbols-rounded">close</span>
    </button>

    <!-- Panel con overflow:hidden para el iframe -->
    <div class="vm-panel" #panel>

      <!-- Drag handle visual para móvil -->
      <div class="vm-drag-handle"></div>

    <!-- ── Player ────────────────────────────────────────── -->
    <div class="vm-player-wrap">
      @if (embedUrl(); as src) {
        <iframe
          [src]="src"
          [title]="data()?.title"
          class="vm-iframe"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      }
    </div>

    <!-- ── Metadata (compacto) ────────────────────────────── -->
    @if (data(); as v) {
      <div class="vm-meta" #meta>

        <!-- Cabecera: eyebrow + duración inline -->
        <div class="flex items-center justify-between gap-3">
          @if (v.seriesTitle) {
            <p class="vm-eyebrow">
              <span translate="no" class="material-symbols-rounded vm-eyebrow-icon">play_circle</span>
              {{ v.seriesTitle }}
            </p>
          }
          @if (v.durationLabel) {
            <span class="inline-flex items-center gap-1 rounded-full bg-[color:var(--surface-soft)] px-2.5 py-0.5 text-[11px] font-bold text-[color:var(--text-secondary)] border border-[color:var(--border-soft)]">
              <span translate="no" class="material-symbols-rounded text-[12px] text-[color:var(--text-mute)]">schedule</span>
              {{ v.durationLabel }}
            </span>
          }
        </div>

        <!-- Título -->
        <h2 id="vm-title" class="vm-title">{{ v.title }}</h2>

        <!-- Descripción -->
        @if (v.description) {
          <p id="vm-description" class="vm-description">{{ v.description }}</p>
        }

        <!-- Tags inline -->
        @if (v.tags?.length) {
          <div class="vm-tags">
            <span *ngFor="let t of v.tags" class="vm-tag">#{{ t }}</span>
          </div>
        }

      </div>
    }

    </div><!-- /vm-panel -->
  </div><!-- /vm-panel-wrap -->
</div><!-- /vm-backdrop -->
