<div class="bit-character" [attr.data-emotion]="emotion()" [attr.data-pose]="pose()">
  <div class="bit-character__float">
    <img
      class="bit-character__shadow"
      src="/personajes/bit/articulado/bit-shadow.png"
      alt=""
      width="363"
      height="111"
      draggable="false"
    />

    <div class="bit-character__part bit-character__leg bit-character__leg--left">
      <img
        src="/personajes/bit/articulado/bit-leg-left.png"
        alt=""
        width="151"
        height="333"
        draggable="false"
      />
    </div>
    <div class="bit-character__part bit-character__leg bit-character__leg--right">
      <img
        src="/personajes/bit/articulado/bit-leg-right.png"
        alt=""
        width="153"
        height="329"
        draggable="false"
      />
    </div>

    <div class="bit-character__part bit-character__arm bit-character__arm--left">
      <img
        src="/personajes/bit/articulado/bit-arm-left.png"
        alt=""
        width="343"
        height="216"
        draggable="false"
      />
    </div>
    <div class="bit-character__part bit-character__arm bit-character__arm--right">
      <img
        src="/personajes/bit/articulado/bit-arm-right.png"
        alt=""
        width="346"
        height="217"
        draggable="false"
      />
    </div>

    <div class="bit-character__part bit-character__torso">
      <img
        src="/personajes/bit/articulado/bit-torso.png"
        alt=""
        width="346"
        height="296"
        draggable="false"
      />
    </div>

    <div class="bit-character__part bit-character__head">
      <img
        src="/personajes/bit/articulado/bit-head.png"
        alt=""
        width="425"
        height="346"
        draggable="false"
      />
      <div class="bit-character__face">
        <span class="bit-character__eye bit-character__eye--left"></span>
        <span class="bit-character__eye bit-character__eye--right"></span>
        <span class="bit-character__mouth"></span>
      </div>
    </div>
  </div>
</div>
