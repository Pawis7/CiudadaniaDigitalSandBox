<article class="card card-hover flex flex-col justify-between overflow-hidden group cursor-pointer" (click)="onCardClick($event)">
  
  <div class="p-5 flex-1 flex flex-col justify-between">
    <div class="space-y-3">
      <!-- Resource Header: Icon & Category Badge -->
      <div class="flex items-center justify-between">
        <span class="grid h-10 w-10 place-items-center rounded-xl text-white shadow-md bg-gradient-to-br"
              [ngClass]="item.colorClass">
          <span translate="no" class="material-symbols-rounded text-lg icon-fill">{{ item.icon }}</span>
        </span>
        
        <span class="rounded-full px-2.5 py-1 text-[10px] font-black uppercase tracking-wider shadow-sm"
              [class.bg-violet-100]="item.type === 'game'" [class.text-violet-700]="item.type === 'game'"
              [class.bg-amber-100]="item.type === 'activity'" [class.text-amber-700]="item.type === 'activity'"
              [class.bg-sky-100]="item.type === 'video'" [class.text-sky-700]="item.type === 'video'"
              [class.bg-rose-100]="item.type === 'guide'" [class.text-rose-700]="item.type === 'guide'">
          {{ item.typeLabel }}
        </span>
      </div>

      <!-- Title & Description -->
      <div class="pt-1.5">
        <h4 class="text-base font-black tracking-tight text-[color:var(--text-primary)] group-hover:text-[color:var(--aud)] transition-colors duration-200">{{ item.title }}</h4>
        <p class="text-xs text-[color:var(--text-soft)] leading-relaxed mt-1.5">{{ item.description }}</p>
      </div>
    </div>

    <!-- Resource Footer Metadata -->
    <div class="mt-4 pt-3 border-t border-[color:var(--border-soft)] flex items-center justify-between text-[11px] font-bold text-[color:var(--text-mute)]">
      <span class="inline-flex items-center gap-1">
        <span translate="no" class="material-symbols-rounded text-[13px]">schedule</span>
        {{ item.duration }}
      </span>

      <span class="inline-flex items-center gap-1 rounded bg-amber-50 text-amber-700 px-1.5 py-0.5 text-[9px] uppercase font-black" *ngIf="item.badge">
        {{ item.badge }}
      </span>
    </div>
  </div>

  <!-- Bottom Button -->
  <div class="px-5 pb-5">
    @if (isWidgetAction()) {
      <button (click)="onAction()"
         class="btn-primary w-full py-3 text-xs font-black flex items-center justify-center gap-1.5 shadow-md cursor-pointer select-none">
        <span translate="no" class="material-symbols-rounded text-sm">play_arrow</span>
        {{ item.actionLabel }}
      </button>
    } @else {
      <a [href]="item.link" 
         [target]="item.link.startsWith('http') ? '_blank' : '_self'"
         class="btn-secondary w-full py-3 text-xs font-black flex items-center justify-center gap-1.5 border border-[color:var(--border-soft)] hover:bg-[color:var(--aud)] hover:text-white hover:border-transparent transition-all">
        <span translate="no" class="material-symbols-rounded text-sm">{{ item.type === 'video' ? 'play_circle' : item.type === 'guide' ? 'download' : 'open_in_new' }}</span>
        {{ item.actionLabel }}
      </a>
    }
  </div>
</article>
