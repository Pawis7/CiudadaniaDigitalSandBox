<section appReveal="fade"
  class="relative mb-8 overflow-hidden rounded-[1.75rem] border border-slate-100 bg-white p-6 shadow-sm sm:mb-12 sm:rounded-[2.5rem] sm:p-12">
  <div aria-hidden="true" class="pointer-events-none absolute -right-20 -top-24 h-72 w-72 rounded-full bg-gradient-to-tr from-emerald-300/30 via-blue-300/30 to-violet-300/30 blur-3xl anim-blob"></div>

  <nav class="mb-3 flex items-center gap-2 text-xs font-semibold text-slate-400">
    <a routerLink="/" class="transition-colors hover:text-slate-700">Inicio</a>
    <span translate="no" class="material-symbols-rounded text-sm">chevron_right</span>
    <span class="text-slate-700">Recursos</span>
  </nav>

  <p appReveal="up" class="text-xs font-black uppercase tracking-widest text-emerald-600">Catálogo de recursos</p>
  <h1 appReveal="up" [revealDelay]="80"
      class="text-balance font-black leading-tight tracking-tight text-slate-800"
      style="font-size: clamp(1.75rem, 2vw + 1rem, 2.75rem)">
    Todo lo que tenemos para ti
  </h1>
  <p appReveal="up" [revealDelay]="160" class="mt-3 max-w-2xl text-sm text-slate-500 sm:text-base">
    Videos, audios, lecturas, planeaciones, infografías y materiales descargables. Filtra por tipo cuando lo necesites.
  </p>
</section>

<section class="mb-8 grid grid-cols-1 gap-4 sm:mb-12 sm:gap-6 md:grid-cols-2 lg:grid-cols-4">
  <a *ngFor="let r of resources; let i = index"
     href="#"
     appReveal="up"
     [revealDelay]="i * 60"
     class="group relative flex h-44 flex-col justify-between overflow-hidden rounded-[1.5rem] border border-slate-100 bg-white p-5 shadow-sm transition-all hover:-translate-y-1 hover:shadow-xl">
    <span class="grid h-12 w-12 place-items-center rounded-xl text-white shadow-lg transition-transform duration-500 group-hover:scale-110"
          [ngClass]="r.bgClass">
      <span translate="no" class="material-symbols-rounded text-2xl icon-fill">{{ r.icon }}</span>
    </span>
    <div>
      <h3 class="text-base font-black tracking-tight text-slate-800">{{ r.title }}</h3>
      <p class="mt-0.5 text-xs leading-relaxed text-slate-500">{{ r.description }}</p>
    </div>
    <span class="absolute right-4 top-4 grid h-8 w-8 place-items-center rounded-full text-slate-300 transition-all group-hover:bg-slate-900 group-hover:text-white">
      <span translate="no" class="material-symbols-rounded text-base">arrow_outward</span>
    </span>
  </a>
</section>

<app-explore-by-topic heading="Filtra por interés"></app-explore-by-topic>
