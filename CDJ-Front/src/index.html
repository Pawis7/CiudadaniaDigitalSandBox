<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ciudadanía Digital · Portal público</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E9004C">
  <meta name="description" content="Portal público para aprender, convivir y participar en entornos digitales de forma segura y responsable.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/garet/Garet-Book.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/garet/Garet-Heavy.woff2" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" crossorigin>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('cdj_theme');
        var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && supportDarkMode)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* Global preloader */
    #global-preloader {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }
    
    html[data-theme='dark'] #global-preloader {
      background: #0A0F1C;
    }
    
    #global-preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }
    
    .preloader-logo {
      font-family: 'Garet', 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #0F172A;
      animation: pulse-grow 2s infinite ease-in-out;
    }
    
    html[data-theme='dark'] .preloader-logo {
      color: #F8FAFC;
    }
    
    .preloader-logo span {
      color: #E9004C;
    }
    
    .preloader-spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(233, 0, 76, 0.15);
      border-radius: 50%;
      border-top-color: #E9004C;
      animation: spin-premium 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    
    @keyframes spin-premium {
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse-grow {
      0%, 100% {
        transform: scale(0.97);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.03);
        opacity: 1;
      }
    }
  </style>
</head>
<body class="text-slate-800">
  <!-- Global Preloader -->
  <div id="global-preloader">
    <div class="preloader-content">
      <div class="preloader-logo">
        Ciudadanía <span>Digital</span>
      </div>
      <div class="preloader-spinner"></div>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
