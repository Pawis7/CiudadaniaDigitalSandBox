<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bg-grad" cx="40%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1b0c26"/>
      <stop offset="50%" stop-color="#0a0712"/>
      <stop offset="100%" stop-color="#040308"/>
    </radialGradient>
    
    <linearGradient id="cyan-btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <linearGradient id="p1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d30"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>

    <linearGradient id="p2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240a33"/>
      <stop offset="100%" stop-color="#100619"/>
    </linearGradient>

    <linearGradient id="p3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281d06"/>
      <stop offset="100%" stop-color="#120c03"/>
    </linearGradient>

    <!-- Halftone Pattern -->
    <pattern id="halftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(168, 85, 247, 0.18)"/>
      <circle cx="8" cy="8" r="1.2" fill="rgba(0, 216, 255, 0.15)"/>
    </pattern>

    <!-- Speedlines Pattern -->
    <pattern id="speedlines" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="20" y2="0" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- Outer Card Background -->
  <rect width="800" height="960" rx="20" fill="url(#bg-grad)"/>
  <rect width="800" height="960" rx="20" fill="url(#halftone)"/>

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(20, 20)">
    <rect width="760" height="68" rx="14" fill="#0f131d" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- ED Icon -->
    <rect x="16" y="14" width="40" height="40" rx="10" fill="#00f0ff"/>
    <text x="36" y="41" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#090d14" text-anchor="middle">ED</text>
    
    <!-- Title Text -->
    <text x="72" y="36" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#ffffff">El servidor de Discor — Servidor simulado</text>
    <text x="72" y="53" font-family="Arial, sans-serif" font-weight="400" font-size="12" fill="#718296">CDJ-GAME-P01 · Cuando el juego se sale de la partida</text>
    
    <!-- Live Badge -->
    <circle cx="688" cy="34" r="5" fill="#00e676"/>
    <text x="700" y="38" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#00e676">EN VIVO</text>
  </g>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <g transform="translate(20, 100)">

    <!-- Watermark Outlines -->
    <path d="M70 650 Q110 610 150 650 T230 650" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="8"/>
    <rect x="60" y="700" width="70" height="60" rx="10" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="6"/>

    <!-- LEFT STENCIL TITLE COLUMN -->
    <g transform="translate(15, 60)">
      <!-- EL -->
      <text x="0" y="100" font-family="'Impact', 'Arial Black', sans-serif" font-size="110" font-weight="900" fill="#ffffff" stroke="#000" stroke-width="4">EL</text>
      
      <!-- Space Invader Pixel Art -->
      <g transform="translate(130, 15) scale(3.5)" fill="#a855f7">
        <path d="M4,0 h3 v1 h-3 z M2,1 h7 v1 h-7 z M1,2 h9 v1 h-9 z M0,3 h3 v1 h-3 z M4,3 h3 v1 h-3 z M8,3 h3 v1 h-3 z M0,4 h11 v1 h-11 z M2,5 h2 v1 h-2 z M7,5 h2 v1 h-2 z M1,6 h2 v1 h-2 z M4,6 h3 v1 h-3 z M8,6 h2 v1 h-2 z M0,7 h2 v1 h-2 z M9,7 h2 v1 h-2 z"/>
      </g>

      <!-- SERVIDOR DE DISCOR -->
      <text x="0" y="220" font-family="'Impact', 'Arial Black', sans-serif" font-size="82" font-weight="900" fill="#ffffff" stroke="#000" stroke-width="4">SERVIDOR</text>
      <text x="0" y="300" font-family="'Impact', 'Arial Black', sans-serif" font-size="75" font-weight="900" fill="#ffffff" stroke="#000" stroke-width="4">DE</text>
      <text x="0" y="405" font-family="'Impact', 'Arial Black', sans-serif" font-size="105" font-weight="900" fill="#00d8ff" stroke="#000" stroke-width="5" filter="drop-shadow(0px 0px 12px rgba(0, 216, 255, 0.6))">DISCOR</text>
    </g>

    <!-- RIGHT COMIC PANELS COLUMN -->
    <g transform="translate(350, 10)">

      <!-- PANEL 1 (Blue border, #1) -->
      <g transform="translate(0, 0)">
        <polygon points="0,15 390,0 390,210 0,225" fill="url(#p1-grad)" stroke="#00d8ff" stroke-width="3" filter="drop-shadow(0px 0px 10px rgba(0, 216, 255, 0.3))"/>
        
        <!-- Badge 1 -->
        <polygon points="0,15 50,13 45,55 0,55" fill="#00d8ff"/>
        <text x="22" y="46" font-family="'Impact', Arial, sans-serif" font-style="italic" font-size="32" fill="#000000" text-anchor="middle">1</text>

        <!-- Gamer Silhouette with Headphones -->
        <g transform="translate(55, 40)">
          <!-- Head/Hair -->
          <path d="M50 30 C30 10 90 0 110 30 C120 50 110 90 90 100 C70 110 40 90 50 30 Z" fill="#0d1117" stroke="#161b22" stroke-width="2"/>
          <path d="M40 35 C35 15 65 5 80 15 C95 25 100 45 85 55 Z" fill="#161b22"/>
          <!-- Headset -->
          <path d="M45 10 Q80 -10 115 15" stroke="#ffffff" stroke-width="5" fill="none"/>
          <rect x="35" y="35" width="22" height="35" rx="10" fill="#00d8ff" stroke="#ffffff" stroke-width="2"/>
          <circle cx="46" cy="52" r="4" fill="#000"/>
        </g>

        <!-- Discord Invitation Modal -->
        <g transform="translate(195, 30)">
          <rect width="180" height="150" rx="12" fill="#1e1f24" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <!-- Discord Logo Icon -->
          <rect x="15" y="18" width="36" height="36" rx="10" fill="#5865f2"/>
          <path d="M25 34 C27 30 39 30 41 34 M28 38 A2 2 0 1 0 28 38.1 M38 38 A2 2 0 1 0 38 38.1" stroke="#fff" stroke-width="2.5" fill="none"/>
          <!-- Text -->
          <text x="60" y="32" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#ffffff">Clan X</text>
          <text x="60" y="48" font-family="Arial, sans-serif" font-size="11" fill="#949ba4">Te han invitado</text>
          <!-- Unirse Button -->
          <rect x="15" y="90" width="150" height="40" rx="8" fill="#00d8ff"/>
          <text x="90" y="115" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#000000" text-anchor="middle">Unirse</text>
          <!-- Cursor Pointer -->
          <path d="M140 115 L155 130 L148 132 L154 142 L149 144 L143 134 L138 138 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        </g>
      </g>

      <!-- PANEL 2 (Purple border, #2) -->
      <g transform="translate(0, 235)">
        <polygon points="0,15 390,0 390,210 0,225" fill="url(#p2-grad)" stroke="#c026d3" stroke-width="3" filter="drop-shadow(0px 0px 10px rgba(192, 38, 211, 0.3))"/>
        
        <!-- Badge 2 -->
        <polygon points="0,15 50,13 45,55 0,55" fill="#c026d3"/>
        <text x="22" y="46" font-family="'Impact', Arial, sans-serif" font-style="italic" font-size="32" fill="#ffffff" text-anchor="middle">2</text>

        <!-- Anxious Boy Illustration -->
        <g transform="translate(50, 30)">
          <!-- Face Silhouette -->
          <path d="M40 30 C30 10 90 0 105 30 C120 60 100 110 75 115 C50 120 30 80 40 30 Z" fill="#2e1038" stroke="#d946ef" stroke-width="1.5"/>
          <!-- Sweat drops -->
          <path d="M30 40 Q25 55 32 58 Q36 55 30 40 Z" fill="#00d8ff"/>
          <path d="M95 50 Q90 65 97 68 Q101 65 95 50 Z" fill="#00d8ff"/>
        </g>

        <!-- Voice Bubbles -->
        <g transform="translate(185, 30)">
          <!-- Bubble 1 -->
          <rect width="190" height="52" rx="20" fill="rgba(192, 38, 211, 0.25)" stroke="#c026d3" stroke-width="1.5"/>
          <circle cx="30" cy="26" r="14" fill="#c026d3"/>
          <!-- Mic icon -->
          <rect x="27" y="18" width="6" height="11" rx="3" fill="#fff"/>
          <path d="M24 25 C24 33 36 33 36 25 M30 32 L30 36" stroke="#fff" stroke-width="2" fill="none"/>
          <text x="54" y="31" font-family="Arial, sans-serif" font-weight="600" font-size="12" fill="#f5d0fe">Confía en nosotros...</text>
          
          <!-- Bubble 2 -->
          <g transform="translate(0, 65)">
            <rect width="190" height="58" rx="20" fill="rgba(192, 38, 211, 0.25)" stroke="#c026d3" stroke-width="1.5"/>
            <circle cx="30" cy="29" r="14" fill="#c026d3"/>
            <rect x="27" y="21" width="6" height="11" rx="3" fill="#fff"/>
            <path d="M24 28 C24 36 36 36 36 28 M30 35 L30 39" stroke="#fff" stroke-width="2" fill="none"/>
            <text x="52" y="28" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#f5d0fe">Si no entras,</text>
            <text x="52" y="44" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#f5d0fe">te vas a quedar fuera.</text>
          </g>
        </g>
      </g>

      <!-- PANEL 3 (Gold border, #3) -->
      <g transform="translate(0, 470)">
        <polygon points="0,15 390,0 390,210 0,225" fill="url(#p3-grad)" stroke="#eab308" stroke-width="3" filter="drop-shadow(0px 0px 10px rgba(234, 179, 8, 0.3))"/>
        
        <!-- Badge 3 -->
        <polygon points="0,15 50,13 45,55 0,55" fill="#eab308"/>
        <text x="22" y="46" font-family="'Impact', Arial, sans-serif" font-style="italic" font-size="32" fill="#000000" text-anchor="middle">3</text>

        <!-- Phone VIP Payment Display -->
        <g transform="translate(60, 20)">
          <rect width="170" height="175" rx="16" fill="#000000" stroke="#eab308" stroke-width="2"/>
          <text x="85" y="32" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#eab308" text-anchor="middle">👑 Acceso VIP</text>
          <text x="85" y="85" font-family="'Impact', Arial, sans-serif" font-weight="900" font-size="42" fill="#eab308" text-anchor="middle">$9.99</text>
          
          <rect x="15" y="115" width="140" height="42" rx="8" fill="linear-gradient(135deg, #f59e0b 0%, #d97706 100%)"/>
          <text x="85" y="141" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#000000" text-anchor="middle">PAGAR AHORA</text>
        </g>

        <!-- Hooded Figure + Coins -->
        <g transform="translate(250, 30)">
          <!-- Hood Silhouette -->
          <path d="M50 20 C20 20 10 60 10 110 L90 110 C90 60 80 20 50 20 Z" fill="#0d0a06" stroke="#eab308" stroke-width="1.5"/>
          <text x="50" y="70" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="#eab308" text-anchor="middle">?</text>
          
          <!-- Stacks of Gold Coins -->
          <g transform="translate(70, 70)">
            <ellipse cx="25" cy="40" rx="20" ry="8" fill="#eab308" stroke="#78350f" stroke-width="1.5"/>
            <ellipse cx="25" cy="32" rx="20" ry="8" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
            <ellipse cx="25" cy="24" rx="20" ry="8" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
            <text x="25" y="27" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#78350f" text-anchor="middle">$</text>
          </g>
        </g>
      </g>

    </g>
  </g>

  <!-- ==================== BOTTOM ACTION BUTTON ==================== -->
  <g transform="translate(20, 810)">
    <rect width="760" height="110" rx="16" fill="url(#cyan-btn-grad)"/>
    <rect width="760" height="110" rx="16" fill="url(#speedlines)"/>
    <rect width="760" height="110" rx="16" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <path d="M230 40 L275 65 L230 90 Z" fill="#000000"/>
    <text x="440" y="75" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#000000" text-anchor="middle" letter-spacing="-1">Iniciar misión</text>
  </g>
</svg>
